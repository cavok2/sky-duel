<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Duel — 2D Flight Game</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1020;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, 'Segoe UI', sans-serif;
  }
  canvas {
    background: #87b5e0;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    max-width: 96vw;
    max-height: 96vh;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="600"></canvas>
<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

let state = 'start'; // 'start' | 'playing' | 'over'
let paused = false;
let time = 0;
let shake = 0;
let winner = '';
let loser = null;
let hits = 0;

const keys = {};
const bullets = [];
const particles = [];
const clouds = [];

for (let i = 0; i < 14; i++) {
  clouds.push({
    x: Math.random() * W,
    y: Math.random() * H * 0.7,
    r: 20 + Math.random() * 40,
    s: 0.2 + Math.random() * 0.5
  });
}

let player, enemy;

function makePlane(x, y, color) {
  return { x, y, vx: 0, vy: 0, angle: 0, hp: 100, maxHp: 100, color, r: 14, cd: 0 };
}

function reset() {
  player = makePlane(W * 0.25, H / 2, '#37e08b');
  player.angle = 0;
  enemy = makePlane(W * 0.75, H / 2, '#ff5a4e');
  enemy.angle = Math.PI;
  bullets.length = 0;
  particles.length = 0;
  hits = 0;
  shake = 0;
  winner = '';
  loser = null;
  paused = false;
  state = 'playing';
}

reset();
state = 'start';

let actx = null;
function initAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f0, f1, dur, type, vol) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(actx.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}
function boom() {
  if (!actx) return;
  const t = actx.currentTime;
  const dur = 0.6;
  const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = actx.createBufferSource();
  src.buffer = buf;
  const f = actx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = 800;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f);
  f.connect(g);
  g.connect(actx.destination);
  src.start(t);
}

addEventListener('keydown', e => {
  initAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (state === 'start') { state = 'playing'; return; }
  if (e.code === 'KeyR' && state === 'over') reset();
  if (e.code === 'KeyP' && state === 'playing') paused = !paused;
});
addEventListener('keyup', e => { keys[e.code] = false; });

function emit(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 3,
      vy: (Math.random() - 0.5) * 3,
      life: 20 + Math.random() * 20,
      max: 40,
      color,
      size: 1 + Math.random() * 2
    });
  }
}
function explode(x, y, color, big) {
  const n = big ? 60 : 25;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (big ? 6 : 3) * (0.4 + Math.random());
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 40 + Math.random() * 40,
      max: 80,
      color: Math.random() < 0.5 ? color : '#ffd166',
      size: 2 + Math.random() * 3
    });
  }
}
function muzzle(p, a) {
  particles.push({
    x: p.x + Math.cos(a) * 24,
    y: p.y + Math.sin(a) * 24,
    vx: Math.cos(a) * 2,
    vy: Math.sin(a) * 2,
    life: 6, max: 6,
    color: '#fff3b0',
    size: 4
  });
}

function clampToArena(p) {
  p.x = Math.max(20, Math.min(W - 20, p.x));
  p.y = Math.max(20, Math.min(H - 20, p.y));
}

function updatePlayer(dt) {
  const ACCEL = 0.55, MAXV = 6;
  let ax = 0, ay = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) ax -= ACCEL;
  if (keys['ArrowRight'] || keys['KeyD']) ax += ACCEL;
  if (keys['ArrowUp'] || keys['KeyW']) ay -= ACCEL;
  if (keys['ArrowDown'] || keys['KeyS']) ay += ACCEL;
  player.vx = (player.vx + ax * dt) * Math.pow(0.94, dt);
  player.vy = (player.vy + ay * dt) * Math.pow(0.94, dt);
  const sp = Math.hypot(player.vx, player.vy);
  if (sp > MAXV) { player.vx = player.vx / sp * MAXV; player.vy = player.vy / sp * MAXV; }
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  if (sp > 0.6) player.angle = Math.atan2(player.vy, player.vx);
  clampToArena(player);
  if (player.cd > 0) player.cd -= dt;
  if (keys['Space'] && player.cd <= 0) {
    player.cd = 12;
    const a = player.angle;
    bullets.push({
      x: player.x + Math.cos(a) * 22,
      y: player.y + Math.sin(a) * 22,
      vx: Math.cos(a) * 10 + player.vx * 0.5,
      vy: Math.sin(a) * 10 + player.vy * 0.5,
      owner: 'player', life: 80, r: 4
    });
    muzzle(player, a);
    tone(900, 240, 0.09, 'square', 0.035);
  }
  if (sp > 1) emit(player.x - Math.cos(player.angle) * 16, player.y - Math.sin(player.angle) * 16, '#9adfff', 1);
}

function updateEnemy(dt) {
  const e = enemy, p = player;
  const dx = p.x - e.x, dy = p.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const ux = dx / d, uy = dy / d;
  const desired = 260;
  const strafe = Math.sin(time * 0.0012) * 140;
  const tx = p.x - ux * desired - uy * strafe;
  const ty = p.y - uy * desired + ux * strafe;

  let dodgeX = 0, dodgeY = 0;
  for (const b of bullets) {
    if (b.owner !== 'player') continue;
    const bx = e.x - b.x, by = e.y - b.y;
    const bd = Math.hypot(bx, by);
    if (bd < 220) {
      const bs = Math.hypot(b.vx, b.vy) || 1;
      const bvx = b.vx / bs, bvy = b.vy / bs;
      if (bx * bvx + by * bvy > 0) {
        const w = (220 - bd) / 220;
        dodgeX += -bvy * w * 260;
        dodgeY += bvx * w * 260;
      }
    }
  }

  const steerX = (tx - e.x) + dodgeX;
  const steerY = (ty - e.y) + dodgeY;
  const sl = Math.hypot(steerX, steerY) || 1;
  const MAXV = 5.2;
  e.vx += (steerX / sl * MAXV - e.vx) * 0.05 * dt;
  e.vy += (steerY / sl * MAXV - e.vy) * 0.05 * dt;
  e.x += e.vx * dt;
  e.y += e.vy * dt;
  const sp = Math.hypot(e.vx, e.vy);
  if (sp > MAXV) { e.vx = e.vx / sp * MAXV; e.vy = e.vy / sp * MAXV; }
  if (sp > 0.6) e.angle = Math.atan2(e.vy, e.vx);
  clampToArena(e);

  if (e.cd > 0) e.cd -= dt;
  if (e.cd <= 0 && d < 520) {
    const bs = 9;
    const tof = d / bs;
    const px = p.x + p.vx * tof;
    const py = p.y + p.vy * tof;
    const a = Math.atan2(py - e.y, px - e.x) + (Math.random() - 0.5) * 0.14 * (0.4 + d / 500);
    e.cd = 26 + Math.random() * 20;
    bullets.push({
      x: e.x + Math.cos(a) * 22,
      y: e.y + Math.sin(a) * 22,
      vx: Math.cos(a) * bs + e.vx * 0.3,
      vy: Math.sin(a) * bs + e.vy * 0.3,
      owner: 'enemy', life: 90, r: 4
    });
    muzzle(e, a);
    tone(520, 160, 0.1, 'sawtooth', 0.03);
  }
  if (sp > 1) emit(e.x - Math.cos(e.angle) * 16, e.y - Math.sin(e.angle) * 16, '#ffb199', 1);
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    let dead = b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20;
    if (!dead) {
      const target = b.owner === 'player' ? enemy : player;
      if (target && target !== loser && Math.hypot(b.x - target.x, b.y - target.y) < b.r + target.r) {
        target.hp -= 10;
        if (b.owner === 'player') hits++;
        explode(b.x, b.y, target.color, false);
        tone(180, 60, 0.12, 'sawtooth', 0.05);
        if (b.owner === 'enemy') shake = 7;
        dead = true;
        if (target.hp <= 0) {
          target.hp = 0;
          loser = target;
          explode(target.x, target.y, target.color, true);
          boom();
          shake = 14;
          state = 'over';
          winner = target === enemy ? 'YOU WIN!' : 'CPU WINS';
        }
      }
    }
    if (dead) bullets.splice(i, 1);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.pow(0.96, dt);
    p.vy *= Math.pow(0.96, dt);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#6fa8dc');
  g.addColorStop(0.7, '#a8c8ec');
  g.addColorStop(1, '#d7e6f7');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (const c of clouds) {
    c.x -= c.s;
    if (c.x < -c.r * 2) {
      c.x = W + c.r * 2;
      c.y = Math.random() * H * 0.7;
    }
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.arc(c.x + c.r * 0.9, c.y + 6, c.r * 0.7, 0, Math.PI * 2);
    ctx.arc(c.x - c.r * 0.9, c.y + 6, c.r * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPlane(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle);
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.moveTo(20, 0);
  ctx.lineTo(-12, 13);
  ctx.lineTo(-6, 0);
  ctx.lineTo(-12, -13);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(4, 0, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function bar(x, y, w, h, frac, color, label, right) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
  ctx.fillStyle = '#333';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * Math.max(0, frac), h);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.textAlign = right ? 'right' : 'left';
  ctx.fillText(label, right ? x + w : x, y - 8);
}

function drawHUD() {
  bar(20, 30, 220, 14, player.hp / player.maxHp, '#37e08b', 'YOU', false);
  bar(W - 240, 30, 220, 14, enemy.hp / enemy.maxHp, '#ff5a4e', 'CPU', true);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillText('Hits: ' + hits, W / 2, 40);
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('Move: WASD / Arrows    Fire: Space    Pause: P    Restart: R', W / 2, H - 14);
}

function drawOverlay(title, sub) {
  ctx.fillStyle = 'rgba(5,10,25,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 52px system-ui, sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 10);
  ctx.font = '20px system-ui, sans-serif';
  ctx.fillStyle = '#cfe3ff';
  ctx.fillText(sub, W / 2, H / 2 + 34);
}

function render() {
  ctx.save();
  if (shake > 0.3) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.9;
  }
  drawBackground();
  for (const b of bullets) {
    ctx.strokeStyle = b.owner === 'player' ? 'rgba(120,255,170,0.6)' : 'rgba(255,110,90,0.6)';
    ctx.beginPath();
    ctx.moveTo(b.x - b.vx * 1.6, b.y - b.vy * 1.6);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.fillStyle = b.owner === 'player' ? '#eaffea' : '#ffd0cb';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  if (player !== loser) drawPlane(player);
  if (enemy !== loser) drawPlane(enemy);
  drawHUD();
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(2, Math.max(0.5, (now - last) / 16.667));
  last = now;
  time += dt * 16.667;
  if (state === 'playing' && !paused) {
    updatePlayer(dt);
    updateEnemy(dt);
    updateBullets(dt);
    updateParticles(dt);
  } else if (state === 'over') {
    updateBullets(dt);
    updateParticles(dt);
  }
  render();
  if (state === 'start') drawOverlay('SKY DUEL', 'WASD / Arrows to fly  ·  Space to shoot  —  press any key to start');
  else if (paused) drawOverlay('PAUSED', 'Press P to resume');
  else if (state === 'over') drawOverlay(winner, 'Press R to fly again');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
